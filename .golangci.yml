version: "2"
# Config of the shared personal Go-projects standard (same as erudit-bot).
# The rules come from the "Go projects standard" note of the private notes vault.
formatters:
  enable: [goimports, gofumpt]
  settings:
    goimports:
      local-prefixes: [github.com/roman-redl/verdict]
linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gocritic
    - errorlint
    - gosec
    - nilerr
    - nilnil
    - noctx
    - contextcheck
    - bodyclose
    - unparam
    - goconst
    - prealloc
    - errname
    - usestdlibvars
    - nolintlint
    - recvcheck
    - modernize
    - misspell
    - unconvert
    - whitespace
    - nakedret
    - predeclared
    - copyloopvar
    - intrange
    - maintidx
    - funlen
    - gocognit
    - lll
    - wsl_v5
    - depguard
    - wrapcheck
    - revive
    - exhaustive
    - testifylint
    - forbidigo
  settings:
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam
    maintidx:
      under: 15
    # a function longer than 80 lines or 50 statements is split by meaning
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    # lll: line length is the default 120 (lll has no settings)
    wsl_v5:
      # blank lines between logical blocks; the settings are the recommended
      # migration (the linter's own hint when moving off wsl v4)
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      # a switch over an enumeration lists every value; default does not
      # replace them and logs the impossible state
      default-signifies-exhaustive: false
    forbidigo:
      # analyze-types: fires only on values of type error,
      # own types with an Error() method are not touched. The own
      # forbid list replaces the built-in fmt.Print* ban: printing a CLI
      # result to stdout is allowed
      analyze-types: true
      forbid:
        - pattern: '^error\.Error$'
          msg: "err.Error() — only at an output boundary; inside the code use %w"
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    wrapcheck:
      # wrapcheck requires context on errors from external packages
      # (database/sql, net/http, SDKs). ignore-sigs are the wrapping helpers
      # themselves (Errorf, Wrap, ...): a wrap is not wrapped again; this is
      # wrapcheck's default list, spelled out explicitly. ignore-sig-regexps
      # are the own internal ports: their adapters already added context, a
      # repeat on every layer is noise.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-sig-regexps:
        - roman-redl/[^)]*/internal/
    depguard:
      rules:
        # general rule: only cmd/* reads the config, adapters receive plain
        # values (tests of the config package itself are not affected)
        config-only-in-cmd:
          files: ["$all", "!**/cmd/**", "!**/internal/config/**"]
          deny:
            - pkg: github.com/roman-redl/verdict/internal/config
              desc: "the config is read only by cmd/*; adapters get plain values"
        # the SQLite driver is allowed only in the run index package
        sqlite-in-db:
          files: ["**/internal/**"]
          deny:
            - pkg: "modernc.org/sqlite"
              desc: "the SQLite driver belongs to internal/db only"
        # the pipeline is the domain: it reaches databases, the network and
        # other processes only through its ports. It writes the run artifacts
        # to disk itself, so `os` stays allowed here (no file-store port).
        pipeline-pure:
          files: ["**/internal/pipeline/**", "!$test"]
          deny:
            - pkg: modernc.org/sqlite
              desc: "the pipeline does not touch a database driver; the run index is cmd's business"
            - pkg: database/sql
              desc: "the pipeline does not touch a database; persistence goes through ports"
            - pkg: net/http
              desc: "the pipeline reaches the network only through its ports"
            - pkg: os/exec
              desc: "the pipeline starts no processes; the LLM backends do that"
            - pkg: github.com/roman-redl/verdict/internal/httpx
              desc: "HTTP belongs to the adapters"
        # the eval is domain logic over the pipeline port: it writes its DOI
        # lists and summaries to disk itself (`os` stays allowed), and reaches
        # databases, the network and processes through nothing at all
        eval-pure:
          files: ["**/internal/eval/**", "!$test"]
          deny:
            - pkg: modernc.org/sqlite
              desc: "the eval does not touch a database driver; the run index is cmd's business"
            - pkg: database/sql
              desc: "the eval does not touch a database"
            - pkg: net/http
              desc: "the eval reaches the network only through the pipeline"
            - pkg: os/exec
              desc: "the eval starts no processes"
            - pkg: github.com/roman-redl/verdict/internal/httpx
              desc: "HTTP belongs to the adapters"
  exclusions:
    paths: ["vendor/"]
    rules:
      # table tests are long by nature — function length is not measured in tests
      - linters: [funlen]
        path: _test\.go
      # internal/db — the only internal package allowed to use the DB driver
      - linters: [depguard]
        path: ^internal/db/
