version: "2"
# Config of the shared personal Go projects standard (same as erudit-bot).
# Source of the rules: the «Стандарт личных Go-проектов» note in the private notes vault.
formatters:
  enable: [goimports, gofumpt]
  settings:
    goimports:
      local-prefixes: [github.com/roman-redl/verdict]
linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gocritic                 # diagnostic + style + performance, see settings below
    - errorlint                # errors.Is/As and %w instead of == and %v
    - gosec                    # security: weak randomness, file permissions, tainted input
    - nilerr                   # return nil when err != nil
    - nilnil                   # return nil, nil — "success" without a value
    - noctx                    # HTTP requests without context
    - contextcheck             # lost ctx: a ctx-aware call chains into context.Background/TODO
    - bodyclose                # unclosed resp.Body
    - unparam                  # unused/always-identical parameters — noise removal
    - goconst                  # repeated strings → constants
    - prealloc
    - errname                  # sentinel errors ErrFoo, types FooError
    - usestdlibvars            # http.StatusOK instead of 200
    - nolintlint               # //nolint only explicit and explained — no silent silencing
    - recvcheck                # receiver consistency (value vs pointer)
    - modernize                # modern Go (ranges, min/max, slices.*)
    - misspell
    - unconvert
    - whitespace
    - nakedret
    - predeclared              # shadowing built-in identifiers
    - copyloopvar
    - intrange
    - maintidx                 # function complexity
    - lll                      # line length
    - wsl_v5  # blank lines between logical blocks (wsl v4 deprecated)
    - depguard                 # import bans between layers (architecture enforced by linter)
    - wrapcheck                # errors from external packages get wrapped with context
    - revive                   # naming, doc comments, early returns
    - exhaustive               # switch over enum covers all values
    - testifylint              # tidy testify asserts (for new tests)
  settings:
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam
    maintidx:
      under: 15                # minimum allowed maintainability index
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    wsl_v5:
      # recommended migration from wsl v4 (the linter's own hint)
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    wrapcheck:
      # default wrapping sigs; own internal ports are exempt: adapters already
      # wrap with context, repeating per layer is noise
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-sig-regexps:
        - roman-redl/[^)]*/internal/
    depguard:
      rules:
        # the SQLite driver is allowed only in the run index package
        sqlite-in-db:
          files: ["**/internal/**"]
          deny:
            - pkg: "modernc.org/sqlite"
              desc: "the SQLite driver belongs to internal/db only"
  exclusions:
    paths: ["vendor/"]
    rules:
      # internal/db — the only internal package allowed to use the DB driver
      - linters: [depguard]
        path: ^internal/db/
