# Benchmark questions for `verdict eval`, taken from MedEvidence:
# Polzak et al., 2025, "Can Large Language Models Match the Conclusions of
# Systematic Reviews?", arXiv 2505.22787; dataset huggingface.co/datasets/clcp/med-evidence,
# code github.com/zy-f/med-evidence. MIT License, Copyright (c) 2025 Christopher Polzak.
#
# Fields per question:
#   id, question, answer, certainty, specialty, studies[].pmid — verbatim from MedEvidence
#     (question_id, question, answer, evidence_certainty, medical_specialty, relevant_sources);
#     certainty "" means the review gives none.
#   claim — the question rewritten as the claim a user puts to verdict ("does A work"); the
#     population comes from the review title; the direction follows what counts as a benefit for
#     the outcome, never the expert answer.
#   works_if — the MedEvidence answer (higher | lower) under which the claim holds.
#   review_pmid, review_doi — the Cochrane review (MedEvidence original_review; DOI via PubMed).
#   studies[].doi — resolved from the PMID through OpenAlex.
questions:
  - id: 10
    question: >-
      Is the breast cancer detection rate in women with dense breasts higher, lower, or the same when
      comparing screening with a combination of mammography and ultrasonography to screening with
      mammography alone?
    claim: >-
      In women with dense breasts, screening with mammography plus ultrasonography detects more breast
      cancers than screening with mammography alone.
    works_if: higher
    answer: higher
    certainty: high
    specialty: Oncology & Hematology
    review_pmid: "36999589"
    review_doi: 10.1002/14651858.CD009632.pub3
    studies:
      - {pmid: "34406400", doi: 10.1001/jamanetworkopen.2021.21505}
      - {pmid: "29571797", doi: 10.1016/j.ejrad.2018.01.022}
      - {pmid: "23116728", doi: 10.1016/j.clinimag.2012.09.018}
      - {pmid: "26549432", doi: 10.1016/j.clinimag.2015.10.001}

