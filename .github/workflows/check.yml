name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: go vet ./...
      - run: go test -race ./...
      - name: Кросс-сборка для Windows
        run: GOOS=windows GOARCH=amd64 go build ./...
